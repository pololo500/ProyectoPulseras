<div class="overlay" (click)="cerrarPopup()"></div>
<div class="card popup">
  <button class="btn-cerrar" (click)="cerrarPopup()">✕</button>
  
  <h2>{{ modoEdicion ? 'Editar Color' : 'Agregar Color' }}</h2>
  
  <form (ngSubmit)="guardarColor()">
    <label for="nombreColor">Nombre del Color</label>
    <input 
      type="text" 
      id="nombreColor" 
      [(ngModel)]="nombreColor" 
      name="nombreColor"
      placeholder="Ej: Azul Océano"
      [class.filled]="nombreColor"
    >

    <label for="rgbColor">Color (RGB)</label>
    <div class="color-picker-container">
      <input 
        type="color" 
        id="rgbColor" 
        [(ngModel)]="rgbColor" 
        name="rgbColor"
        class="color-picker"
      >
      <div class="color-preview" [style.background-color]="rgbColor">
        <span>{{ rgbColor }}</span>
      </div>
    </div>

    <label for="categoria">Categoría</label>
    <select 
      id="categoria" 
      [(ngModel)]="categoria" 
      name="categoria"
      [class.filled]="categoria"
    >
      <option value="" disabled>Seleccione una categoría</option>
      <option value="translucido">Translúcido</option>
      <option value="polvo">Polvo</option>
    </select>

    <p class="error" *ngIf="error">{{ error }}</p>

    <div class="botones-popup">
      <button type="submit" [disabled]="!formularioValido() || guardando">
        {{ guardando ? 'Guardando...' : (modoEdicion ? '💾 Guardar Cambios' : 'Guardar Color') }}
      </button>
      
      <button type="button" class="btn-eliminar-color" *ngIf="modoEdicion" (click)="confirmarEliminarColor()" [disabled]="eliminando">
        🗑️ {{ eliminando ? 'Eliminando...' : 'Eliminar Color' }}
      </button>

      <button type="button" class="btn-importar" (click)="inputColoresJson.click()" *ngIf="!modoEdicion">
        📁 Importar desde JSON
      </button>
      <input #inputColoresJson type="file" accept=".json" (change)="importarColoresJson($event)" style="display: none;">
    </div>
  </form>

  <!-- Confirmación de eliminación -->
  <app-popup-confirm
    *ngIf="mostrarConfirmEliminar"
    titulo="¿Eliminar color?"
    [mensaje]="'¿Estás seguro de eliminar el color &quot;' + nombreColor + '&quot;? Esta acción no se puede deshacer.'"
    (confirmar)="eliminarColor()"
    (cancelar)="cancelarEliminar()">
  </app-popup-confirm>

  <!-- Popup de alerta -->
  <app-popup-alerta
    *ngIf="mensajeAlerta"
    [mensaje]="mensajeAlerta"
    [tipo]="tipoAlerta"
    (cerrar)="cerrarAlerta()">
  </app-popup-alerta>
</div>
