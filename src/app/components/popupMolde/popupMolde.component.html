<div class="overlay" (click)="cerrarPopup()"></div>
<div class="card popup">
  <button class="btn-cerrar" (click)="cerrarPopup()">✕</button>
  
  <h2>{{ modoEdicion ? 'Editar Molde' : 'Agregar Molde' }}</h2>
  
  <form (ngSubmit)="guardarMolde()">
    <label for="nombreMolde">Nombre del Molde</label>
    <input 
      type="text" 
      id="nombreMolde" 
      [(ngModel)]="nombreMolde" 
      name="nombreMolde"
      placeholder="Ej: Corazón Grande"
      [class.filled]="nombreMolde"
    >

    <div class="capas-section">
      <div class="capas-header">
        <label>Capas del Molde</label>
        <button type="button" class="btn-agregar-capa" (click)="agregarCapa()">+ Agregar Capa</button>
      </div>
      
      <div class="capa-row" *ngFor="let capa of capas; let i = index" [class.capa-vacia]="!esCapaValida(capa)">
        <div class="capa-orden" *ngIf="esCapaValida(capa)">
          <button 
            type="button" 
            class="btn-orden" 
            (click)="moverCapaArriba(i)"
            [disabled]="i === 0"
            title="Mover arriba"
          >▲</button>
          <button 
            type="button" 
            class="btn-orden" 
            (click)="moverCapaAbajo(i)"
            [disabled]="i >= capas.length - 1 || !esCapaValida(capas[i + 1] || {nombre: '', volumen: null})"
            title="Mover abajo"
          >▼</button>
        </div>
        <div class="capa-inputs">
          <input 
            type="text" 
            [(ngModel)]="capa.nombre" 
            [name]="'capaNombre' + i"
            placeholder="Nombre de capa"
            (input)="verificarYAgregarCapa(i)"
            [class.filled]="capa.nombre"
          >
          <input 
            type="number" 
            [(ngModel)]="capa.volumen" 
            [name]="'capaVolumen' + i"
            placeholder="Volumen (ml)"
            min="0"
            step="0.1"
            (input)="verificarYAgregarCapa(i)"
            [class.filled]="capa.volumen"
          >
        </div>
        <button 
          type="button" 
          class="btn-eliminar-capa" 
          (click)="eliminarCapa(i)"
          *ngIf="capas.length > 1"
          title="Eliminar capa"
        >🗑️</button>
      </div>
    </div>

    <p class="error" *ngIf="error">{{ error }}</p>

    <div class="botones-popup">
      <button type="submit" [disabled]="!formularioValido() || guardando">
        {{ guardando ? 'Guardando...' : (modoEdicion ? '💾 Guardar Cambios' : 'Guardar Molde') }}
      </button>
      
      <button type="button" class="btn-eliminar-molde" *ngIf="modoEdicion" (click)="confirmarEliminarMolde()" [disabled]="eliminando">
        🗑️ {{ eliminando ? 'Eliminando...' : 'Eliminar Molde' }}
      </button>

      <button type="button" class="btn-importar" (click)="inputMoldesJson.click()" *ngIf="!modoEdicion">
        📁 Importar desde JSON
      </button>
      <input #inputMoldesJson type="file" accept=".json" (change)="importarMoldesJson($event)" style="display: none;">
    </div>
  </form>

  <!-- Confirmación de eliminación -->
  <app-popup-confirm
    *ngIf="mostrarConfirmEliminar"
    titulo="¿Eliminar molde?"
    [mensaje]="'¿Estás seguro de eliminar el molde &quot;' + nombreMolde + '&quot;? Esta acción no se puede deshacer. Los productos que usen este molde podrían verse afectados.'"
    (confirmar)="eliminarMolde()"
    (cancelar)="cancelarEliminar()">
  </app-popup-confirm>

  <!-- Popup de alerta -->
  <app-popup-alerta
    *ngIf="mensajeAlerta"
    [mensaje]="mensajeAlerta"
    [tipo]="tipoAlerta"
    (cerrar)="cerrarAlerta()">
  </app-popup-alerta>
</div>
